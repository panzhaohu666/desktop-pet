name: Build & Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 等标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: DesktopPet-linux.zip
            display: Linux
          - os: windows-latest
            artifact: DesktopPet-windows.zip
            display: Windows
          - os: macos-latest
            artifact: DesktopPet-macos.zip
            display: macOS

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libegl1 libgl1 libopengl0

      - name: Install Python deps
        run: pip install pyinstaller PyQt5 pillow

      - name: Build with PyInstaller
        run: python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DesktopPet-*.zip
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: 生成发布说明
        id: body
        run: |
          cat > release.md << 'BODYEOF'
          ## 🎉 桌宠精灵 ${{ github.ref_name }}

          跨平台桌面宠物 — 透明无边框、始终置顶。支持 Windows / Linux / macOS。

          ### ✨ 功能特点

          | 功能 | 说明 |
          |------|------|
          | 🪟 透明无边框 | 去除背景、无边框、始终置顶 |
          | 🖱️ 拖拽移动 | 左键按住拖动，屏幕边界限制 + 边缘磁吸 |
          | 🎬 9 种动画 | 跳跃、压扁、抖动、倾斜、扭动、弹跳、后空翻、喷嚏、旋转 |
          | 👆👆 双击彩蛋 | 单击 6 种随机 + 双击 3 种隐藏动画 |
          | 🌬️ 呼吸动画 | 闲置时持续正弦微动，仿佛在呼吸 |
          | 🚶 自动游走 | 每 25~50 秒自动随机漫步 |
          | 🔍 滚轮缩放 | 50%~250% 自由调节 |
          | 💬 对话气泡 | 60+ 条中文短语，激动时变粉色气泡 |
          | 📌 系统托盘 | 最小化到托盘，点击显示/隐藏 |
          | 💾 配置记忆 | 自动记住位置、大小、置顶状态 |

          ### 📥 下载

          | 平台 | 文件 | 使用方式 |
          |------|------|----------|
          | 🪟 Windows | `DesktopPet-windows.zip` | 解压后双击 `DesktopPet.exe` |
          | 🐧 Linux | `DesktopPet-linux.zip` | 解压后运行 |
          | 🍎 macOS | `DesktopPet-macos.zip` | 解压后运行 |

          ### 🎮 操作指南

          | 操作 | 方式 |
          |------|------|
          | 移动 | 左键拖拽 |
          | 随机互动（6 种） | 单击 |
          | 特殊互动（3 种） | 双击 |
          | 菜单 | 右键 |
          | 缩放 | 鼠标滚轮 |

          ### 🎨 自定义角色

          替换 `resources/pet.png` 为你的透明 PNG 图片即可。

          ### 🔧 源码运行

          ```bash
          git clone https://github.com/panzhaohu666/desktop-pet.git
          cd desktop-pet
          pip install -r requirements.txt
          python run.py
          ```

          **完整更新记录**: https://github.com/panzhaohu666/desktop-pet/commits/${{ github.ref_name }}
          BODYEOF

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopPet-*.zip
          body_path: release.md
          draft: false
          prerelease: false

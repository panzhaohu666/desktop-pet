name: Build & Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 等标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: DesktopPet-linux.zip
            display: Linux
          - os: windows-latest
            artifact: DesktopPet-windows.zip
            display: Windows
          - os: macos-latest
            artifact: DesktopPet-macos.zip
            display: macOS

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libegl1 libgl1 libopengl0

      - name: Install Python deps
        run: pip install pyinstaller PyQt5 pillow

      - name: Build with PyInstaller
        run: python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: DesktopPet-*.zip
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: 提取当前版本更新日志
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # 去掉 v 前缀用于匹配 CHANGELOG
          CLEAN_VER="${VERSION#v}"
          
          # 从 CHANGELOG.md 提取当前版本的变更内容
          python3 << 'PYEOF'
          import re, sys

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          version = sys.argv[1] if len(sys.argv) > 1 else ""
          # 匹配 "## vX.Y.Z" 或 "## vX.Y.Z（日期）"
          pattern = rf"(## v{re.escape(version)}[^\n]*\n.*?)(?=\n## v|\Z)"
          match = re.search(pattern, content, re.DOTALL)

          if match:
              with open("changelog_section.md", "w", encoding="utf-8") as out:
                  out.write(match.group(1).strip())
              print(f"CHANGELOG_SECTION extracted for v{version}")
          else:
              print(f"WARNING: no CHANGELOG entry found for v{version}")
              with open("changelog_section.md", "w", encoding="utf-8") as out:
                  out.write("")
          PYEOF $CLEAN_VER

      - name: 检查是否有更新日志
        id: has_changelog
        run: |
          if [ -s changelog_section.md ]; then
            echo "HAS_LOG=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_LOG=false" >> $GITHUB_OUTPUT
          fi

      - name: 生成完整发布说明（有更新日志）
        if: steps.has_changelog.outputs.HAS_LOG == 'true'
        run: |
          cat > release.md << 'BODYEOF'
          ## 🎉 桌宠精灵 ${{ github.ref_name }}

          跨平台桌面宠物 — 透明无边框、始终置顶。Windows / Linux / macOS。

          ---

          ### 📋 本次更新内容
          BODYEOF
          
          cat changelog_section.md >> release.md
          
          cat >> release.md << 'BODYEOF'

          ---

          ### 📥 下载

          | 平台 | 文件 | 使用方式 |
          |------|------|----------|
          | 🪟 Windows | `DesktopPet-windows.zip` | 解压后双击 `DesktopPet.exe` |
          | 🐧 Linux | `DesktopPet-linux.zip` | 解压后运行 |
          | 🍎 macOS | `DesktopPet-macos.zip` | 解压后运行 |

          ### 🎮 操作指南

          | 操作 | 方式 |
          |------|------|
          | 移动 | 左键拖拽 |
          | 随机互动（6 种） | 单击 |
          | 特殊互动（3 种） | 双击 |
          | 菜单 | 右键 |
          | 缩放 | 鼠标滚轮 |

          **完整更新记录**: https://github.com/panzhaohu666/desktop-pet/commits/${{ github.ref_name }}
          BODYEOF

      - name: 生成完整发布说明（无更新日志）
        if: steps.has_changelog.outputs.HAS_LOG == 'false'
        run: |
          cat > release.md << 'BODYEOF'
          ## 🎉 桌宠精灵 ${{ github.ref_name }}

          跨平台桌面宠物 — 透明无边框、始终置顶。Windows / Linux / macOS。

          ### 📥 下载

          | 平台 | 文件 | 使用方式 |
          |------|------|----------|
          | 🪟 Windows | `DesktopPet-windows.zip` | 解压后双击 `DesktopPet.exe` |
          | 🐧 Linux | `DesktopPet-linux.zip` | 解压后运行 |
          | 🍎 macOS | `DesktopPet-macos.zip` | 解压后运行 |

          **完整更新记录**: https://github.com/panzhaohu666/desktop-pet/commits/${{ github.ref_name }}
          BODYEOF

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopPet-*.zip
          body_path: release.md
          draft: false
          prerelease: false

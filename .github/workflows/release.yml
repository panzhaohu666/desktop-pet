name: Build & Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 等标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: DesktopPet-linux.zip
            display: Linux
          - os: windows-latest
            artifact: DesktopPet-windows.zip
            display: Windows
          - os: macos-latest
            artifact: DesktopPet-macos.zip
            display: macOS

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libegl1 libgl1 libopengl0

      - name: Install Python deps
        run: pip install pyinstaller PyQt5 pillow

      - name: Build with PyInstaller
        run: python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: DesktopPet-*.zip
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: 生成发布说明
        run: |
          cat > release.md << 'BODYEOF'
          ## 🎉 桌宠精灵 ${{ github.ref_name }}

          跨平台桌面宠物 — 透明无边框、始终置顶。Windows / Linux / macOS。

          ### 📋 更新内容

          详见 [CHANGELOG.md](https://github.com/panzhaohu666/desktop-pet/blob/main/CHANGELOG.md)

          ### 📥 下载

          | 平台 | 文件 | 使用方式 |
          |------|------|----------|
          | 🪟 Windows | `DesktopPet-windows.zip` | 解压后双击 `DesktopPet.exe` |
          | 🐧 Linux | `DesktopPet-linux.zip` | 解压后运行 |
          | 🍎 macOS | `DesktopPet-macos.zip` | 解压后运行 |

          ### 🎮 操作指南

          | 操作 | 方式 |
          |------|------|
          | 移动 | 左键拖拽 |
          | 随机互动（6 种） | 单击 |
          | 特殊互动（3 种） | 双击 |
          | 菜单 | 右键 |
          | 缩放 | 鼠标滚轮 |

          ### 🔧 源码运行

          ```bash
          git clone https://github.com/panzhaohu666/desktop-pet.git
          cd desktop-pet
          pip install -r requirements.txt
          python run.py
          ```

          完整更新记录：https://github.com/panzhaohu666/desktop-pet/commits/${{ github.ref_name }}
          BODYEOF

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopPet-*.zip
          body_path: release.md
          draft: false
          prerelease: false
